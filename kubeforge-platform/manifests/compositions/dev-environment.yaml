# KubeForge environment provisioning:
# One DevEnvironment XR ->
# Namespace + ResourceQuota + LimitRange
# + Viewer Role + Deployer Role
# + Deployer ServiceAccount + RoleBinding
# + NetworkPolicy.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kubeforge-devenvironment
spec:
  compositeTypeRef:
    apiVersion: platform.kubeforge.io/v1alpha1
    kind: DevEnvironment
  mode: Pipeline
  pipeline:
    - step: build-environment
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $team := $xr.spec.team }}
            {{- $size := $xr.spec.size }}
            {{- $profile := default "isolated" $xr.spec.networkProfile }}
            ---
            # 1. Namespace
            apiVersion: v1
            kind: Namespace
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-namespace
                {{- if hasKey $.observed.resources "environment-namespace" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
                platform.kubeforge.io/team: {{ $team }}
            ---
            # 2. Namespace-wide ResourceQuota
            apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: environment-quota
              namespace: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-quota
                {{- if hasKey $.observed.resources "environment-quota" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
            spec:
              hard:
                {{- if eq $size "small" }}
                requests.cpu: "2"
                requests.memory: 4Gi
                {{- else if eq $size "medium" }}
                requests.cpu: "4"
                requests.memory: 8Gi
                {{- else }}
                {{- fail "unsupported DevEnvironment size" }}
                {{- end }}
            ---
            # 3. Per-container LimitRange
            apiVersion: v1
            kind: LimitRange
            metadata:
              name: environment-limits
              namespace: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-limits
                {{- if hasKey $.observed.resources "environment-limits" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
            spec:
              limits:
                - type: Container
                  {{- if eq $size "small" }}
                  defaultRequest:
                    cpu: 100m
                    memory: 128Mi
                  default:
                    cpu: 500m
                    memory: 512Mi
                  min:
                    cpu: 50m
                    memory: 64Mi
                  max:
                    cpu: "1"
                    memory: 1Gi
                  {{- else if eq $size "medium" }}
                  defaultRequest:
                    cpu: 250m
                    memory: 256Mi
                  default:
                    cpu: "1"
                    memory: 1Gi
                  min:
                    cpu: 100m
                    memory: 128Mi
                  max:
                    cpu: "2"
                    memory: 2Gi
                  {{- else }}
                  {{- fail "unsupported DevEnvironment size" }}
                  {{- end }}
            ---
            # 4. Viewer Role
            # Read-only permissions for application workloads.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: environment-viewer
              namespace: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-viewer-role
                {{- if hasKey $.observed.resources "environment-viewer-role" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
            rules:
              - apiGroups: [""]
                resources:
                  - pods
                  - services
                verbs:
                  - get
                  - list
                  - watch
              - apiGroups: [""]
                resources:
                  - pods/log
                verbs:
                  - get
              - apiGroups: ["apps"]
                resources:
                  - deployments
                  - replicasets
                  - statefulsets
                  - daemonsets
                verbs:
                  - get
                  - list
                  - watch
              - apiGroups: ["batch"]
                resources:
                  - jobs
                  - cronjobs
                verbs:
                  - get
                  - list
                  - watch
            ---
            # 5. Deployer Role
            # Manage application workloads but not RBAC,
            # ServiceAccounts, ResourceQuotas or LimitRanges.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: environment-deployer
              namespace: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-deployer-role
                {{- if hasKey $.observed.resources "environment-deployer-role" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
            rules:
              # Read workloads and services.
              - apiGroups: [""]
                resources:
                  - pods
                  - services
                  - configmaps
                verbs:
                  - get
                  - list
                  - watch
              # Access container logs.
              - apiGroups: [""]
                resources:
                  - pods/log
                verbs:
                  - get
              # Create and manage application Pods,
              # Services and ConfigMaps.
              - apiGroups: [""]
                resources:
                  - pods
                  - services
                  - configmaps
                verbs:
                  - create
                  - update
                  - patch
                  - delete
              # Read application controllers.
              - apiGroups: ["apps"]
                resources:
                  - deployments
                  - replicasets
                  - statefulsets
                  - daemonsets
                verbs:
                  - get
                  - list
                  - watch
              # Deploy and manage application controllers.
              - apiGroups: ["apps"]
                resources:
                  - deployments
                  - statefulsets
                  - daemonsets
                verbs:
                  - create
                  - update
                  - patch
                  - delete
              # Read and manage batch workloads.
              - apiGroups: ["batch"]
                resources:
                  - jobs
                  - cronjobs
                verbs:
                  - get
                  - list
                  - watch
                  - create
                  - update
                  - patch
                  - delete
            ---
            # 6. ServiceAccount for deployment automation
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: environment-deployer
              namespace: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-deployer-sa
                {{- if hasKey $.observed.resources "environment-deployer-sa" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
            automountServiceAccountToken: false
            ---
            # 7. Bind the deployer Role to its ServiceAccount
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: environment-deployer
              namespace: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-deployer-binding
                {{- if hasKey $.observed.resources "environment-deployer-binding" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
            subjects:
              - kind: ServiceAccount
                name: environment-deployer
                namespace: {{ $name }}
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: environment-deployer
            ---
            # 8. Environment NetworkPolicy
            # Both profiles: same-namespace traffic + Kubernetes DNS.
            # Standard also permits HTTPS to public IPv4 destinations.
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: environment-network-policy
              namespace: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: environment-network-policy
                {{- if hasKey $.observed.resources "environment-network-policy" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                platform.kubeforge.io/environment: {{ $name }}
            spec:
              podSelector: {}
              policyTypes:
                - Ingress
                - Egress
              ingress:
                # Allow incoming connections only from Pods in this Namespace.
                - from:
                    - podSelector: {}
              egress:
                # Allow connections to Pods in this Namespace.
                - to:
                    - podSelector: {}
                # Allow DNS queries to CoreDNS in kube-system.
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kube-system
                      podSelector:
                        matchLabels:
                          k8s-app: kube-dns
                  ports:
                    - protocol: UDP
                      port: 53
                    - protocol: TCP
                      port: 53
                {{- if eq $profile "standard" }}
                # Allow public HTTPS; exclude private/internal IPv4 ranges.
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                        except:
                          - 0.0.0.0/8
                          - 10.0.0.0/8
                          - 100.64.0.0/10
                          - 127.0.0.0/8
                          - 169.254.0.0/16
                          - 172.16.0.0/12
                          - 192.0.0.0/24
                          - 192.0.2.0/24
                          - 192.168.0.0/16
                          - 198.18.0.0/15
                          - 198.51.100.0/24
                          - 203.0.113.0/24
                          - 224.0.0.0/4
                          - 240.0.0.0/4
                  ports:
                    - protocol: TCP
                      port: 443
                {{- else if ne $profile "isolated" }}
                {{- fail "unsupported DevEnvironment networkProfile" }}
                {{- end }}
