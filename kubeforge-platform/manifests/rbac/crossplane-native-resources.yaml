# Permissions required by Crossplane to manage
# native Kubernetes resources for KubeForge environments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeforge-crossplane-native-composition
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"

rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
