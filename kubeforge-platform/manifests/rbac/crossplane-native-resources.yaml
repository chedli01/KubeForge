# Permissions required by Crossplane to provision
# and manage native Kubernetes resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeforge-crossplane-native-composition
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"

rules:
  # Native Kubernetes resources
  - apiGroups: [""]
    resources:
      - namespaces
      - resourcequotas
      - limitranges
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Manage namespace Roles and RoleBindings
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Allow Crossplane to provision and bind the
  # two predefined KubeForge Roles.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
    resourceNames:
      - environment-viewer
      - environment-deployer
    verbs:
      - escalate
      - bind

  # Manage environment network policies
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
